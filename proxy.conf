# 简幻欢 LL 部署脚本 —— GitHub 代理设置
#
# ⚠️ 代理只作用于 GitHub（lip.exe 下载、lip install 拉取 BDS / LeviLamina）。
#    WineHQ、微软 dotnet CDN、VC++ 一律直连，不走代理。
#
# ⚠️ PROXY_URL 必须填「容器能访问到的」代理地址。
#    不能填 127.0.0.1 —— 容器里的 127.0.0.1 是容器自己，那里没有代理。
#    填错时脚本会检测到 loopback 并自动降级为直连，不会导致下载失败。
#
# 一般不需要代理：实测容器内直连 GitHub 1.5~2.7MB/s。
# 只有 GitHub 被限速或不可达时才改成 yes。

USE_PROXY=no
PROXY_URL=
